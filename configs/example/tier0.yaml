# 实验版 · Tier 0（冒烟配置）
#
# SPEC 1.1.1: 每个版本的配置都在这里，不硬编码在代码里。
# 实践版对应 configs/practical/tier1.yaml，两者走同一个加载器
# (example/common/version.py::load_config)。

version: example
tier: tier0
purpose: pipeline validity, not model quality

model:
  hidden_size: 256
  num_layers: 2
  num_heads: 2
  num_kv_heads: 1
  intermediate_size: 768
  context_length: 128
  vocab_size: 6400
  rope_theta: 10000.0
  rms_norm_eps: 1e-6
  tie_word_embeddings: true

tokens:
  pad: 0
  bos: 1
  eos: 2
  mask: 27

train:
  steps: 200
  batch_size: 8
  lr: 3e-4            # AR pretrain; A2D fine-tune 用 1e-4
  dlm_lr: 1e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95
  seed: 42
  log_every: 20
  loss_window: 20

data:
  prepared_dir: data/prepared/tinystories-6400
  max_blocks: 4096     # 4096 x 128 = 524,288 token

runtime:
  dtype: bfloat16
  loss_window: 20